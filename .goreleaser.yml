# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: sqlc-gen-poolroute
    main: ./cmd/sqlc-gen-poolroute
    binary: sqlc-gen-poolroute
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
