# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: sqlc-pgx-route
    main: ./cmd/sqlc-pgx-route
    binary: sqlc-pgx-route
    env:
      # classify uses pg_query_go (libpg_query, cgo) to parse SQL at build time.
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
