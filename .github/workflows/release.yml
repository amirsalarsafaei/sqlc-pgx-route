name: Release

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run tests
        run: go test ./...

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/sqlc-gen-poolroute-linux-amd64        ./cmd/sqlc-gen-poolroute
          GOOS=linux   GOARCH=arm64 go build -o dist/sqlc-gen-poolroute-linux-arm64        ./cmd/sqlc-gen-poolroute
          GOOS=darwin  GOARCH=amd64 go build -o dist/sqlc-gen-poolroute-darwin-amd64       ./cmd/sqlc-gen-poolroute
          GOOS=darwin  GOARCH=arm64 go build -o dist/sqlc-gen-poolroute-darwin-arm64       ./cmd/sqlc-gen-poolroute
          GOOS=windows GOARCH=amd64 go build -o dist/sqlc-gen-poolroute-windows-amd64.exe ./cmd/sqlc-gen-poolroute

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest dist/* \
            --title "Latest Build" \
            --notes "Latest build from master (commit: ${{ github.sha }})" \
            --prerelease
