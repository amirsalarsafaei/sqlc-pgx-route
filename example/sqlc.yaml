version: '2'
# sqlc's built-in Go generator (unmodified, always the version of sqlc you run)
# emits db.go / models.go / query.sql.go. The routing wrapper (poolroute.go) is
# layered on afterwards by `sqlc-pgx-route ./db` — see gen.go / the Makefile.
sql:
  - engine: postgresql
    queries: query.sql
    schema: schema.sql
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
